[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "octtriage"
version = "0.1.0"
description = "Fail-safe retinal OCT clinical decision-support prototype"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nathan Lee Yang" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "kagglehub>=0.3,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "Pillow>=10,<12",
  "pydicom>=2.4,<4",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "scikit-learn>=1.4,<2",
  "streamlit>=1.38,<2",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
oct-train = "octtriage.training.train:main"
oct-evaluate = "octtriage.evaluation.evaluate:main"
oct-prepare-kermany = "octtriage.data.prepare_kermany:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
